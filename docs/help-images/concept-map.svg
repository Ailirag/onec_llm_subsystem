<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/>
    </marker>
    <style>
      .title { font-size: 17px; font-weight: 600; fill: #1f2a37; }
      .band { font-size: 12px; fill: #5f6b7a; font-weight: 600; letter-spacing: 0.5px; }
      .name { font-size: 14px; font-weight: 600; fill: #1f2a37; }
      .note { font-size: 12px; fill: #3d4a5a; }
      .setup { fill: #eaf3fb; stroke: #6a9fd4; stroke-width: 1.5; }
      .action { fill: #fff6d6; stroke: #c9a227; stroke-width: 1.5; }
      .user { fill: #e8f5e9; stroke: #5baf6b; stroke-width: 1.5; }
      .side { fill: #f5f5f5; stroke: #9aa3ad; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .link { stroke: #5f6b7a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #9aa3ad; stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
  <text x="24" y="32" class="title">Из чего состоит подсистема LLM</text>

  <text x="24" y="70" class="band">МОДЕЛЬ — ЧЕМ ОТВЕЧАТЬ (раздел «Модели и агенты»)</text>
  <rect x="24" y="82" width="190" height="78" rx="8" class="setup"/>
  <text x="40" y="106" class="name">Провайдер</text>
  <text x="40" y="126" class="note">Yandex, OpenAI, LM Studio…</text>
  <text x="40" y="144" class="note">адрес, ключ, лимиты</text>

  <rect x="264" y="82" width="190" height="78" rx="8" class="setup"/>
  <text x="280" y="106" class="name">Модель</text>
  <text x="280" y="126" class="note">идентификатор модели</text>
  <text x="280" y="144" class="note">у провайдера, контекст, цена</text>

  <rect x="504" y="82" width="210" height="78" rx="8" class="setup"/>
  <text x="520" y="106" class="name">Агент</text>
  <text x="520" y="126" class="note">инструкция, доступ к данным,</text>
  <text x="520" y="144" class="note">MCP и RAG; кому доступен</text>

  <rect x="764" y="82" width="190" height="78" rx="8" class="setup"/>
  <text x="780" y="106" class="name">Сценарий</text>
  <text x="780" y="126" class="note">агент + модель +</text>
  <text x="780" y="144" class="note">схема ответа</text>

  <path d="M214,121 L260,121" class="link"/>
  <path d="M454,121 L500,121" class="link"/>
  <path d="M714,121 L760,121" class="link"/>

  <text x="24" y="210" class="band">ДЕЙСТВИЕ — ЧТО И ГДЕ ДЕЛАТЬ (AI-действие = место запуска)</text>
  <rect x="504" y="222" width="450" height="118" rx="8" class="action"/>
  <text x="520" y="246" class="name">Место запуска (AI-действие)</text>
  <text x="520" y="268" class="note">где показать: в карточке объекта, в списке или в разделе LLM;</text>
  <text x="520" y="287" class="note">что дать модели: файл, данные объекта, разговор;</text>
  <text x="520" y="306" class="note">что сделать с ответом: показать, заполнить, записать, создать;</text>
  <text x="520" y="325" class="note">кому показывать; какая обработка вмешивается в этапы</text>

  <rect x="24" y="222" width="430" height="118" rx="8" class="action"/>
  <text x="40" y="246" class="name">Карта извлечения</text>
  <text x="40" y="268" class="note">какие поля вернет модель и в какие реквизиты</text>
  <text x="40" y="287" class="note">объекта они лягут: шапка, табличные части,</text>
  <text x="40" y="306" class="note">дополнительные реквизиты. Из карты строится</text>
  <text x="40" y="325" class="note">схема ответа сценария</text>

  <path d="M859,160 L859,218" class="link"/>
  <path d="M454,281 L500,281" class="link"/>

  <text x="24" y="390" class="band">РАБОТА ПОЛЬЗОВАТЕЛЯ И ОБСЛУЖИВАНИЕ</text>
  <rect x="504" y="402" width="210" height="96" rx="8" class="user"/>
  <text x="520" y="426" class="name">AI-помощник</text>
  <text x="520" y="447" class="note">пользователь выбирает</text>
  <text x="520" y="465" class="note">действие, отвечает на вопросы,</text>
  <text x="520" y="483" class="note">проверяет результат</text>

  <rect x="764" y="402" width="190" height="96" rx="8" class="user"/>
  <text x="780" y="426" class="name">Объект базы</text>
  <text x="780" y="447" class="note">документ, справочник:</text>
  <text x="780" y="465" class="note">форма заполнена, объект</text>
  <text x="780" y="483" class="note">записан или создан</text>

  <path d="M609,340 L609,398" class="link"/>
  <path d="M714,450 L760,450" class="link"/>

  <rect x="24" y="402" width="200" height="96" rx="8" class="side"/>
  <text x="40" y="426" class="name">Монитор операций</text>
  <text x="40" y="447" class="note">каждый запуск: файлы,</text>
  <text x="40" y="465" class="note">запрос, ответ, токены,</text>
  <text x="40" y="483" class="note">ошибки</text>

  <rect x="254" y="402" width="200" height="96" rx="8" class="side"/>
  <text x="270" y="426" class="name">Адаптер конфигурации</text>
  <text x="270" y="447" class="note">значения, которых ядро</text>
  <text x="270" y="465" class="note">не знает: роли и авто-</text>
  <text x="270" y="483" class="note">подстановки в ДО</text>

  <path d="M354,398 L354,344" class="soft"/>

  <text x="24" y="536" class="note">Пакет сценария переносит место, карту и сценарий в другую базу одним файлом; описать действие можно и самому — JSON-файлом.</text>
</svg>

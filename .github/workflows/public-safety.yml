name: Public repository safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check publication readiness
        shell: pwsh
        run: ./tools/Test-PublicationReadiness.ps1

      - name: Check subsystem coverage
        shell: pwsh
        run: ./tools/Test-SubsystemCoverage.ps1
